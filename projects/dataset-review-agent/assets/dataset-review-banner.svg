<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="A magnifying glass over a data grid, revealing cells flagged in red and amber that stay invisible in the surrounding dark grid, beside a panel summarising findings by severity">
  <defs>
    <clipPath id="lens"><circle cx="360" cy="200" r="168"/></clipPath>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121935"/>
      <stop offset="100%" stop-color="#0A0F1E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#35598F" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#35598F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#ground)"/>
  <circle cx="360" cy="200" r="310" fill="url(#glow)"/>

  <!-- The data as it arrives: problems are present but invisible -->
  <g stroke="#212B44" stroke-width="1.5" fill="none">
    <path d="M55 72 H905 M55 122 H905 M55 172 H905 M55 222 H905 M55 272 H905 M55 322 H905"/>
    <path d="M55 72 V322 M175 72 V322 M295 72 V322 M415 72 V322 M535 72 V322 M655 72 V322 M775 72 V322 M905 72 V322"/>
  </g>
  <rect x="55" y="72" width="850" height="36" fill="#1B2440"/>
  <g fill="#2C3855">
    <rect x="72" y="85" width="72" height="10" rx="2"/><rect x="192" y="85" width="58" height="10" rx="2"/>
    <rect x="312" y="85" width="66" height="10" rx="2"/><rect x="432" y="85" width="52" height="10" rx="2"/>
    <rect x="552" y="85" width="70" height="10" rx="2"/><rect x="672" y="85" width="60" height="10" rx="2"/>
    <rect x="792" y="85" width="64" height="10" rx="2"/>
  </g>
  <g fill="#1E2740">
    <rect x="562" y="138" width="80" height="22" rx="3"/><rect x="682" y="188" width="80" height="22" rx="3"/>
    <rect x="562" y="288" width="80" height="22" rx="3"/><rect x="802" y="238" width="80" height="22" rx="3"/>
    <rect x="682" y="288" width="80" height="22" rx="3"/><rect x="802" y="138" width="80" height="22" rx="3"/>
  </g>

  <!-- Under the lens: the same rows, lit, with what was hidden now named -->
  <g clip-path="url(#lens)">
    <rect x="180" y="10" width="370" height="380" fill="#F7F8FA"/>
    <g stroke="#C4CCDA" stroke-width="1.5" fill="none">
      <path d="M55 122 H905 M55 172 H905 M55 222 H905 M55 272 H905 M55 322 H905"/>
      <path d="M295 10 V390 M415 10 V390"/>
    </g>
    <rect x="180" y="72" width="370" height="36" fill="#16203C"/>
    <g fill="#5F6E8C">
      <rect x="192" y="85" width="58" height="10" rx="2"/><rect x="312" y="85" width="66" height="10" rx="2"/>
      <rect x="432" y="85" width="52" height="10" rx="2"/>
    </g>
    <rect x="192" y="138" width="80" height="22" rx="3" fill="#BE1E2D"/>
    <rect x="312" y="138" width="80" height="22" rx="3" fill="#E0921C"/>
    <rect x="432" y="188" width="80" height="22" rx="3" fill="#BE1E2D"/>
    <rect x="192" y="238" width="80" height="22" rx="3" fill="#E0921C"/>
    <rect x="312" y="238" width="80" height="22" rx="3" fill="#9AA4B8" opacity="0.4"/>
    <rect x="400" y="272" width="80" height="22" rx="3" fill="#BE1E2D"/>
    <rect x="228" y="272" width="80" height="22" rx="3" fill="#9AA4B8" opacity="0.4"/>
    <circle cx="360" cy="200" r="168" fill="#8FB4E8" opacity="0.06"/>
  </g>

  <circle cx="360" cy="200" r="168" fill="none" stroke="#EAEDF4" stroke-width="14"/>
  <circle cx="360" cy="200" r="178" fill="none" stroke="#0A0F1E" stroke-width="6" opacity="0.45"/>
  <path d="M479 319 L560 400" stroke="#EAEDF4" stroke-width="32" stroke-linecap="round"/>
  <path d="M479 319 L560 400" stroke="#A9B4CB" stroke-width="13" stroke-linecap="round" opacity="0.4"/>

  <!-- Findings panel: the report's own severity ledger, at real proportions -->
  <g transform="translate(960 96)">
    <rect x="-18" y="-24" width="290" height="256" rx="6" fill="#161E38" opacity="0.85"/>
    <rect x="-18" y="-24" width="290" height="256" rx="6" fill="none" stroke="#2B3654" stroke-width="1.5"/>
    <rect x="-18" y="-24" width="290" height="5" rx="2" fill="#BE1E2D"/>

    <g transform="translate(0 12)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#BE1E2D"/>
      <rect x="22" y="1" width="118" height="8" rx="2" fill="#E9ECF3" opacity="0.75"/>
      <rect x="22" y="19" width="196" height="6" rx="2" fill="#8894AE" opacity="0.4"/>
      <rect x="22" y="33" width="164" height="6" rx="2" fill="#8894AE" opacity="0.4"/>
    </g>
    <g transform="translate(0 78)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#BE1E2D"/>
      <rect x="22" y="1" width="96" height="8" rx="2" fill="#E9ECF3" opacity="0.75"/>
      <rect x="22" y="19" width="210" height="6" rx="2" fill="#8894AE" opacity="0.4"/>
      <rect x="22" y="33" width="140" height="6" rx="2" fill="#8894AE" opacity="0.4"/>
    </g>
    <g transform="translate(0 144)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#E0921C"/>
      <rect x="22" y="1" width="132" height="8" rx="2" fill="#E9ECF3" opacity="0.62"/>
      <rect x="22" y="19" width="180" height="6" rx="2" fill="#8894AE" opacity="0.32"/>
    </g>

    <g transform="translate(0 198)">
      <rect x="0" y="0" width="98" height="7" rx="2" fill="#BE1E2D"/>
      <rect x="104" y="0" width="66" height="7" rx="2" fill="#E0921C"/>
      <rect x="176" y="0" width="98" height="7" rx="2" fill="#5C6577"/>
    </g>
  </g>
</svg>
